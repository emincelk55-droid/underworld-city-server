name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uw
          POSTGRES_PASSWORD: uw
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API testleri
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://uw:uw@localhost:5432/uw_test
      - name: Ekonomi simülasyonu
        run: npm run sim

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release

  docker:
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - name: Docker imajı derlenebiliyor mu
        run: docker build -t underworld-city .

  android:
    runs-on: ubuntu-latest
    needs: [client]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: APK derle
        run: flutter build apk --release
      - name: APK'yı indirilebilir yap (Actions → bu çalışma → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: UnderworldCity-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
